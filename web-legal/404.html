<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#FBF7F1" />
  <title>Page not found — Outstanding Partner</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="/assets/app-icon.png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{ --bg:#FBF7F1; --text:#2A2521; --muted:#7C7268; --border:#ECE3D6; --primary:#C0392B; --primary-2:#D9663F; --ring:rgba(192,57,43,.26); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; -webkit-font-smoothing:antialiased; }
    .card { text-align:center; max-width:440px; }
    .logo { width:56px; height:56px; border-radius:14px; margin:0 auto 22px; display:block; box-shadow:0 2px 10px rgba(0,0,0,.14); }
    .code { font-family:'Playfair Display',Georgia,serif; font-size:64px; font-weight:900; color:var(--primary); line-height:1; margin-bottom:8px; }
    h1 { font-family:'Playfair Display',Georgia,serif; font-size:26px; font-weight:700; margin-bottom:12px; }
    p { font-size:15px; color:var(--muted); line-height:1.7; margin-bottom:28px; }
    .btn { display:inline-block; background:linear-gradient(135deg,var(--primary),var(--primary-2)); color:#fff; text-decoration:none; font-weight:700; font-size:15px; padding:14px 32px; border-radius:999px; box-shadow:0 6px 18px var(--ring); }
    .links { margin-top:22px; font-size:13px; }
    .links a { color:var(--muted); text-decoration:none; margin:0 10px; }
    .links a:hover { color:var(--primary); }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/assets/app-icon.png" alt="Outstanding Partner" width="56" height="56" />
    <div class="code">404</div>
    <h1>This page wandered off.</h1>
    <p>We couldn't find the page you were looking for — but you're only one tap away from becoming the partner she brags about.</p>
    <a class="btn" href="/">Back to home</a>
    <div class="links">
      <a href="/privacy">Privacy Policy</a>
      <a href="/support">Support</a>
      <a href="/terms">Terms</a>
    </div>
  </div>
</body>
</html>
